<style>
/* Uma coluna de leitura (máx. 720px), uma tela por etapa. Visual igual ao da página catharinenabuco.com/pac: verde-escuro, creme e dourado, títulos em Fraunces. Look único de propósito (escuro). */
:root {
  --bg: #0F2E22;
  --surface: #173B2C;
  --surface2: #1F4837;
  --ink: #F2F0EB;
  --ink2: rgba(242, 240, 235, .68);
  --line: rgba(243, 241, 236, .16);
  --gold: #DEBD6E;
  --gold-fill: #F2F0EB;
  --on-gold: #0F2E22;
  --good: #86DBA0;
  --bad: #F2A5A5;
  --focus: #DEBD6E;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Inter", system-ui, "Segoe UI", sans-serif;
  --f-mono: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 720px; margin-inline: auto; display: grid; gap: 28px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }

.brand { display: flex; align-items: center; gap: 12px; }
.brand .mark { height: 34px; width: auto; flex: none; display: block; }
.brand .up { color: var(--gold); font-weight: 600; }
.brand .sub { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); line-height: 1.3; }

.eyebrow { font-family: var(--f-body); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); justify-self: start; border: 1px solid rgba(222,189,110,.45); border-radius: 999px; padding: 6px 12px; }
.screen { display: grid; gap: 24px; }
.hero h1 { font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.02; }
.hero h1 em { font-style: italic; color: var(--gold); }
.lead { color: var(--ink2); font-size: 1.1rem; max-width: 52ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 1rem; cursor: pointer; background: var(--gold-fill); color: var(--on-gold); text-decoration: none; min-height: 48px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

.hero-top { display: grid; gap: 22px; align-items: center; }
.hero-copy { display: grid; gap: 18px; align-content: center; min-width: 0; }
.hero .lead { color: rgba(242, 240, 235, .82); font-size: 1.15rem; line-height: 1.6; max-width: 46ch; }

.path li i { font-style: normal; font-family: var(--f-display); font-weight: 600; width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.hero-photo { position: relative; width: min(48vw, 190px); display: grid; gap: 20px; justify-items: center; justify-self: center; margin-block: 10px; }
.hero-photo .hp-lupa { position: relative; width: 100%; aspect-ratio: 1; }
.hero-photo .ph { position: absolute; left: 6%; top: 6%; width: 76%; height: 76%; border-radius: 50%; overflow: hidden; background: #0b1f16; display: flex; align-items: center; justify-content: center; }
.hero-photo .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-photo .ph img.wm { object-fit: contain; padding: 20% 18%; }
.hero-photo .ph span { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.2rem, 11vw, 3.2rem); color: var(--gold); letter-spacing: .06em; }
.hero-photo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sym { position: absolute; font-family: var(--f-display); color: var(--gold); opacity: .22; pointer-events: none; user-select: none; line-height: 1; animation: drift 7s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-7px) rotate(var(--r, 0deg)); } }
@media (min-width: 640px) {
  .hero-top { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 28px; }
  .hero-photo { width: min(100%, 220px); }
}
@media (prefers-reduced-motion: reduce) { .sym { animation: none; } }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.stick { position: sticky; bottom: 0; z-index: 5; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(15,46,34,0), var(--bg) 35%); }
.row.stick .btn { width: 100%; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.step span { color: var(--ink2); font-size: 14px; }

.choices { display: grid; gap: 10px; }
.choice { display: block; position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.choice .box { display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; min-height: 52px; }
.choice .box .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface2); color: var(--ink2); flex: none; }
.choice input:checked + .box { border-color: var(--gold); background: var(--surface2); }
.choice input:checked + .box .k { background: var(--gold-fill); color: var(--on-gold); }
.choice input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }

.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--f-mono); font-size: 13px; color: var(--ink2); }
.progress { height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--gold-fill); border-radius: 999px; transition: width .25s ease; }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.4rem, 4.6vw, 1.9rem); line-height: 1.2; }
.qtext sup, .choice sup, .exp sup { font-size: 70%; line-height: 0; }
.qhint { color: var(--ink2); font-size: 14px; }

.score { display: grid; gap: 6px; }
.score .num { font-family: var(--f-display); font-weight: 600; font-size: clamp(4rem, 16vw, 6.5rem); line-height: .95; color: var(--gold); letter-spacing: -0.04em; }
.score .num small { font-size: .4em; color: var(--ink2); font-weight: 600; letter-spacing: 0; }
.verdict { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 16px 18px; display: grid; gap: 4px; }
.verdict b { font-family: var(--f-display); font-size: 1.2rem; }
.groups { display: grid; gap: 14px; }
.grp { display: grid; gap: 6px; }
.grp .top { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.grp .top span:last-child { font-family: var(--f-mono); color: var(--ink2); }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--gold-fill); }
.topics { display: grid; gap: 8px; }
.topic { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
.topic > summary, .topic > .sum { list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
.topic > summary { cursor: pointer; }
.topic > summary::-webkit-details-marker { display: none; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

.dot.no { border: 2px solid var(--bad); color: var(--bad); }
.topic .tname { font-weight: 600; }
.topic .tstate { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
.topic .exp { padding: 0 14px 14px 52px; color: var(--ink2); font-size: 15px; display: grid; gap: 6px; }
.topic .exp b { color: var(--ink); }
.next { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: n; }
.next li { counter-increment: n; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; align-items: start; }
.next li::before { content: counter(n); width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); color: var(--gold); font-family: var(--f-mono); display: inline-flex; align-items: center; justify-content: center; }
.next b { display: block; }
.next span { color: var(--ink2); font-size: 15px; }
.cta { background: var(--surface); border: 1px solid var(--gold); border-radius: 16px; padding: 22px; display: grid; gap: 12px; }

.share { background: var(--surface2); border-radius: 12px; padding: 14px 16px; font-size: 15px; color: var(--ink); word-break: break-word; user-select: all; }
.fine { color: var(--ink2); font-size: 13px; }
footer { color: var(--ink2); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; border-top: 1px solid var(--line); padding-top: 16px; }
.stepper { display: flex; flex-wrap: wrap; gap: 8px 20px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--ink2); }
.stepper li { display: inline-flex; align-items: center; gap: 8px; }
.stepper .c { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 12px; border: 1.5px solid var(--line); }
.stepper .now { color: var(--ink); font-weight: 600; }
.stepper .now .c { background: var(--gold-fill); color: var(--on-gold); border-color: var(--gold-fill); }
.stepper .done .c { background: var(--good); color: var(--on-gold); border-color: var(--good); }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } .topic .exp { padding-left: 14px; } }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
.fld { display: grid; gap: 6px; font-size: 15px; color: var(--ink2); }
.fld input { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 48px; color: var(--ink); width: 100%; }
.fld input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: var(--gold); }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink2); }
.agree input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--gold-fill); flex: none; }

.route { display: grid; gap: 14px; text-align: center; justify-items: stretch; }
.route h3.big { font-family: var(--f-display); font-size: clamp(2rem, 9vw, 3rem); line-height: 1.04; letter-spacing: -.01em; color: var(--gold); text-wrap: balance; }
.btn.xl { box-sizing: border-box; max-width: 100%; padding: 20px 26px; font-size: 1.15rem; width: 100%; text-decoration: none; text-align: center; }
.vs { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); text-align: left; }
@media (min-width: 700px) { .vs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .vs .btn.xl { grid-column: 1 / -1; } }
.vs .col { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.vs .col.pac { border-color: var(--gold); background: var(--surface2); }
.vs h4 { font-family: var(--f-display); font-size: 1.3rem; }
.vs ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; color: var(--ink2); }
.vs .chip { display: inline-block; justify-self: start; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; }
.vs .col.solo .chip { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.vs .col.pac .chip { background: var(--gold-fill); color: var(--on-gold); }
</style>

    { ico: "potencia", topic: "Potenciação (expoente negativo)", group: 2, mod: "módulo 3, Potência e radiciação", text: "Calcule: 3<sup>−2</sup> · 4<sup>−2</sup>", opts: ["1/144", "−144", "144", "1/12"], correct: 0,
      exp: "Expoente negativo inverte a base: 3⁻² = 1/3² = 1/9 e 4⁻² = 1/4² = 1/16. Multiplicando: 1/9 · 1/16 = 1/144. Quem achou −144 tratou o sinal do expoente como sinal do número. Quem achou 144 esqueceu de inverter." },
    { ico: "etiqueta", topic: "Porcentagem: fator de aumento e redução", group: 1, mod: "módulo 2, Decimais, frações e porcentagem", text: "Um produto custava R$ 250,00. Subiu 20% e, depois, o novo preço caiu 25%. Qual é o preço final?", opts: ["R$ 225,00", "R$ 237,50", "R$ 250,00", "R$ 212,50"], correct: 0,
      exp: "Aumento de 20% é multiplicar por 1,20: 250 × 1,20 = 300. Queda de 25% é multiplicar por 0,75: 300 × 0,75 = 225. Quem somou os percentuais (+20 − 25 = −5%) achou R$ 237,50." },
    { ico: "cubo", topic: "Produtos notáveis", group: 3, mod: "módulo 4, Fatoração e produtos notáveis", text: "Desenvolva: (x + 3)<sup>3</sup>", opts: ["x<sup>3</sup> + 9x<sup>2</sup> + 27x + 27", "x<sup>3</sup> + 27", "x<sup>3</sup> + 3x<sup>2</sup> + 9x + 27", "x<sup>3</sup> + 9x<sup>2</sup> + 27"], correct: 0,
      exp: "O cubo da soma tem quatro termos: (x + 3)³ = x³ + 3·x²·3 + 3·x·3² + 3³ = x³ + 9x² + 27x + 27. Conferindo: (x + 3)² · (x + 3) = (x² + 6x + 9)(x + 3) dá o mesmo resultado. Esquecer os termos do meio (x³ + 27) é o erro número 1." },
    { ico: "raiz", topic: "Radiciação", group: 2, mod: "módulo 3, Potência e radiciação", text: "Calcule: √50 + √18 − √8", opts: ["6√2", "√60", "10√2", "4√2"], correct: 0,
      exp: "Simplifique cada raiz: √50 = 5√2, √18 = 3√2 e √8 = 2√2. Então 5√2 + 3√2 − 2√2 = 6√2. Não dá para somar o que está dentro da raiz (√60)." },
    { ico: "lupa", topic: "Fatoração", group: 3, mod: "módulo 4, Fatoração e produtos notáveis", text: "Qual é o valor de (997<sup>2</sup> − 3<sup>2</sup>) ÷ 994?", opts: ["1000", "997", "991", "1003"], correct: 0,
      exp: "É a diferença de dois quadrados: 997² − 3² = (997 − 3)(997 + 3) = 994 · 1000. Dividindo por 994, sobra 1000. Sem fatorar, a conta seria enorme." },
    { ico: "parabola", topic: "Equação do 2º grau", group: 4, mod: "módulo 5, 2º grau", text: "Se x<sup>2</sup> − 6x + k = 0 tem uma única raiz real, qual é o valor de k?", opts: ["9", "6", "3", "12"], correct: 0,

      '<path d="M40 62 A56 56 0 0 1 78 36" fill="none" stroke="#F2F0EB" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>' +
      '<line x1="147" y1="147" x2="188" y2="188" stroke="#DEBD6E" stroke-width="15" stroke-linecap="round"/>' +
      '<line x1="147" y1="147" x2="160" y2="160" stroke="#0F2E22" stroke-opacity=".35" stroke-width="15" stroke-linecap="round"/></svg>';
  }

  function symbols() {
    var S = [["\u03C0", "-6%", "6%", "2.6rem", "-10deg", "0s"], ["\u221A", "92%", "2%", "2.4rem", "8deg", "1.2s"], ["\u2211", "-10%", "58%", "2.5rem", "6deg", "2.1s"], ["\u00F7", "96%", "46%", "2.4rem", "-8deg", ".6s"], ["x\u00B2", "-8%", "28%", "2rem", "6deg", "1.8s"], ["\u221E", "0%", "92%", "2.4rem", "-6deg", "2.8s"], ["%", "46%", "-8%", "2rem", "10deg", "3.2s"]];
    return S.map(function (a) {
      return '<span class="sym" aria-hidden="true" style="left:' + a[1] + ";top:" + a[2] + ";font-size:" + a[3] + ";--r:" + a[4] + ";animation-delay:" + a[5] + '">' + a[0] + "</span>";
    }).join("");
  }

  function heroView() {
    return '<section class="screen hero"><div class="hero-top">' +
      '<div class="hero-copy">' +
      '<div class="eyebrow">Teste sua base, hein!</div>' +
      '<h1>Quanto da sua base de matemática ficou <em>para trás</em>?</h1>' +
      '<p class="lead">10 questões, 10 minutos. Você vê na hora onde a sua base trava e por onde começar a consertar.</p>' +
      '<ol class="path"><li><i>1</i>Seu momento</li><li><i>2</i>10 questões</li><li><i>3</i>Seu Raio X</li></ol>' +
      '</div>' +
      '<div class="hero-photo"><div class="hp-tag"><img src="' + LOGO + '" alt="Método PAC"></div><div class="hp-lupa"><div class="ph"><span>\u03C0</span></div>' + lupa() + symbols() + '</div></div>' +
      '</div><div class="row stick"><button class="btn" id="go" type="button">Fazer meu Raio X</button></div>' +
      '</section>';
  }

  function profileView() {
    var h = '<section class="screen"><div class="eyebrow">Passo 1 de 2</div><h2 style="font-size:clamp(1.7rem,5.5vw,2.4rem)">Qual é o seu momento hoje?</h2>' +
      '<p class="lead">Isso muda só as dicas do seu resultado. Escolha a opção que mais combina com você.</p><form id="pf" class="screen"><div class="choices">';
    PROFILES.forEach(function (p, i) {
      h += '<label class="choice"><input type="radio" name="profile" id="pr' + i + '" value="' + p.id + '"' + (state.profile === p.id ? " checked" : "") + '><span class="box"><span class="k">' + (i + 1) + '</span><span>' + p.label + '</span></span></label>';
    });
    h += '</div><div class="row stick"><button class="btn" id="start" type="button"' + (state.profile ? "" : " disabled") + '>Começar as questões</button></div></form></section>';
    return h;
  }

  function quizView() {
    var q = QUESTIONS[state.idx];
    var order = state.order[state.idx];
    var pct = Math.round((state.idx / QUESTIONS.length) * 100);
    var h = '<section class="screen">' +
      '<div class="qhead"><span>Questão ' + (state.idx + 1) + ' de ' + QUESTIONS.length + '</span><span id="clock">0:00</span></div>' +
      '<div class="progress" role="progressbar" aria-label="Progresso do Raio X" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="qrow"><h2 class="qtext">' + q.text + '</h2><div class="ico">' + (ICONS[q.ico] || "") + '</div></div>' +
      '<p class="qhint">Escolha uma alternativa. Se travar, chute o que parece mais certo: o erro também mostra onde está o buraco.</p>' +
      '<form id="qf" class="screen"><div class="choices">';
    order.forEach(function (oi, pos) {
      h += '<label class="choice"><input type="radio" name="opt" id="o' + pos + '" value="' + oi + '"' + (state.picked[state.idx] === oi ? " checked" : "") + '><span class="box"><span class="k">' + LETTERS[pos] + '</span><span>' + q.opts[oi] + '</span></span></label>';
    });
    h += '</div><div class="row stick"><button class="btn" id="next" type="button"' + (state.picked[state.idx] == null ? " disabled" : "") + '>' + (state.idx === QUESTIONS.length - 1 ? "Ver meu Raio X" : "Próxima questão") + '</button></div></form></section>';
    return h;
  }

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function gateView() {
    var l = state.lead || {};
    return '<section class="screen"><div class="eyebrow">Passo 3 de 3</div>' +
      '<h2 style="font-size:clamp(1.7rem,5.5vw,2.4rem)">Seu Raio X está pronto, 100%.</h2>' +
      '<p class="lead">Diga para onde mandar e veja agora a sua nota, o mapa dos tópicos e o que fazer primeiro.</p>' +
      '<form id="gf" class="screen" novalidate>' +
      '<label class="fld"><span>Seu nome</span><input id="g-name" type="text" autocomplete="given-name" required value="' + esc(l.name) + '" placeholder="Como posso te chamar?"></label>' +
      '<label class="fld"><span>Seu WhatsApp (com DDD)</span><input id="g-zap" type="tel" inputmode="tel" autocomplete="tel" required value="' + esc(l.zap) + '" placeholder="(11) 99999-9999"></label>' +
      '<label class="fld"><span>Seu melhor e-mail</span><input id="g-mail" type="email" autocomplete="email" required value="' + esc(l.mail) + '" placeholder="voce@email.com"></label>' +
      '<label class="agree"><input id="g-ok" type="checkbox"><span>Aceito receber meu resultado e novidades do Método PAC por WhatsApp e e-mail. Tenho 18 anos ou mais, ou meu responsável autoriza.</span></label>' +
      '<p class="fine" id="g-err" role="alert"></p>' +
      '<div class="row stick"><button class="btn" type="button">Ver meu Raio X</button></div></form></section>';
  }

  function calc() {
    var score = 0, missed = [];
    QUESTIONS.forEach(function (q, i) { if (state.picked[i] === q.correct) score++; else missed.push(q.topic); });
    return { score: score, missed: missed };
  }

  function sendLead() {
    if (!LEAD_ENDPOINT || !state.lead) return;
    var c = calc();
    var prof = PROFILES.filter(function (p) { return p.id === state.profile; })[0] || PROFILES[0];
    var body = JSON.stringify({ nome: state.lead.name, whatsapp: state.lead.zap, email: state.lead.mail, nota: c.score, momento: prof.label, travou_em: c.missed.join("; "), tempo_s: Math.round((state.tEnd - state.t0) / 1000), origem: location.search, quando: new Date().toISOString() });
    try { fetch(LEAD_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body }); } catch (e) {}
  }

  function trackEvent(ev) {
    if (!LEAD_ENDPOINT || !state.lead) return;
    var body = JSON.stringify({ evento: ev, nome: state.lead.name, whatsapp: state.lead.zap, email: state.lead.mail, quando: new Date().toISOString() });
    try { fetch(LEAD_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body }); } catch (e) {}
  }

  function resultView() {
    var score = 0, gScore = GROUPS.map(function () { return 0; }), gTotal = GROUPS.map(function () { return 0; }), missed = [];
    QUESTIONS.forEach(function (q, i) {
      var ok = state.picked[i] === q.correct;
      gTotal[q.group]++; if (ok) { score++; gScore[q.group]++; } else missed.push(q.topic);
    });
    var prof = PROFILES.filter(function (p) { return p.id === state.profile; })[0] || PROFILES[0];
    var verdict;
    if (score <= 4) verdict = ["Parece que a matemática já te fez sentir que a base não é pra você.", "Você acertou " + score + " de 10, e o que faltou foi ordem, não capacidade. Se bateu vergonha de voltar ao básico, é bem comum: muita gente trava nas matérias avançadas justamente por causa da base. Voltar ao básico é o caminho mais curto."];
    else if (score <= 7) verdict = ["Parece que você sabe mais do que acha e trava em pontos específicos.", "Você acertou " + score + " de 10. Veja abaixo os tópicos marcados para revisar: é onde o seu tempo rende mais. Se bateu vergonha de voltar ao básico, é bem comum, e é o que destrava as matérias avançadas."];
    else verdict = ["Parece que a sua base já é boa.", "Você acertou " + score + " de 10. O seu ganho agora está em velocidade, em interpretar o enunciado e em não errar na última linha da conta."];

    function lvl(r) { return r === 1 ? ["ok", "Tá ótimo, já tá arrasando"] : r === 0 ? ["urg", "Urgente"] : r < 0.5 ? ["need", "Precisa melhorar"] : ["mid", "Mais ou menos"]; }
    function gname(g) { return GROUPS[g].replace(/ \(.*\)/, ""); }
    var rev = []; for (var gx = 0; gx < GROUPS.length; gx++) { if (gScore[gx] < gTotal[gx]) rev.push(gx); }
    rev.sort(function (a, b) { return (gScore[a] / gTotal[a]) - (gScore[b] / gTotal[b]) || a - b; });
    rev = rev.slice(0, 2);
    var focus = '<div class="focus"><span class="print"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Tire um print desta parte</span><h3>Principais coisas a revisar</h3>' + (rev.length ? '<ol>' + rev.map(function (g) { return '<li><div><b>' + gname(g) + '</b> <span>No PAC: módulo ' + (g + 1) + ' · você acertou\u00A0' + gScore[g] + '\u00A0de\u00A0' + gTotal[g] + '</span></div></li>'; }).join("") + '</ol>' : '<p>Nada urgente. O seu foco agora é ganhar velocidade e atenção no enunciado.</p>') + '</div>';
    var weak = 0, wr = 2; for (var g = 0; g < GROUPS.length; g++) { var r = gScore[g] / gTotal[g]; if (r < wr) { wr = r; weak = g; } }
    var weakMsg = wr === 1 ? "Você acertou todos os grupos. O próximo passo é ganhar tempo." : "Seu grupo mais fraco: " + GROUPS[weak].replace(/ \(.*\)/, "") + ". No PAC, o seu ponto de partida é o módulo " + (weak + 1) + ".";

    var h = '<section class="screen"><div class="rhead"><div class="eyebrow">' + (state.lead ? esc(state.lead.name) + ", s" : "S") + 'eu Raio X</div>' + (PHOTO_QUADRO ? '<img class="rface" src="' + PHOTO_QUADRO + '" alt="Catharine Nabuco dando aula">' : "") + '</div>' +
      '<div class="score"><h2 class="num" style="font-size:clamp(4rem,16vw,6.5rem);line-height:.95">' + score + '<small> de 10</small></h2><p class="fine">Tempo: ' + fmtTime(state.tEnd - state.t0) + ' · Momento: ' + prof.label.toLowerCase() + '</p></div>' +
      focus +
      '<div class="verdict"><b>' + verdict[0] + '</b><span>' + verdict[1] + '</span></div>' +
      '<div class="screen" style="gap:12px"><h3 style="font-size:1.3rem">Tópico por tópico</h3><p class="fine">Toque em um tópico que você errou para ver o caminho certo.</p><div class="topics">';
    QUESTIONS.forEach(function (q, i) {
      var ok = state.picked[i] === q.correct;
      var right = q.opts[q.correct];
      if (ok) {
        h += '<div class="topic"><div class="sum"><span class="dot ok" aria-hidden="true">✓</span><span class="tname">' + q.topic + '</span><span class="tstate">acertou</span></div></div>';
      } else {
        h += '<details class="topic"><summary><span class="dot no" aria-hidden="true">!</span><span class="tname">' + q.topic + '</span><span class="tstate">revisar</span></summary>' +
          '<div class="exp"><span><b>Resposta certa:</b> ' + right + '</span><span><b>No PAC:</b> ' + q.mod + '</span><span>' + q.exp.replace(/([a-z0-9])(\^)(\d)/g, "$1<sup>$3</sup>") + '</span></div></details>';
      }
    });
    h += '</div></div>' +
      '<div class="route"><h3 class="big">O QUE EU FAÇO AGORA, CATHY?</h3>' + (PHOTO_QUADRO ? '<img class="rboard" src="' + PHOTO_QUADRO + '" alt="Catharine Nabuco dando aula">' : "") +
      '<p class="fine">' + prof.tip + '</p>' +
      '<button class="btn xl" id="reveal" type="button" aria-expanded="false" aria-controls="compare">DESCUBRA AQUI →</button>' +
      '<div class="vs" id="compare" hidden>' +
      '<div class="col solo"><h4>Por conta própria</h4><span class="chip">De 3 meses a 1 ano</span><ul>' +
      '<li>Você pega os tópicos que errou e revisa um por um.</li>' +
      '<li><b>Os riscos:</b> aulas soltas, exercícios soltos e professores que não explicam de verdade (e ainda deixam trauma).</li>' +
      '<li>Sem uma ordem, é fácil se perder e desistir no meio.</li></ul></div>' +
      '<div class="col pac"><h4>Com o Método PAC</h4><span class="chip">15 dias com dedicação</span><ul>' +
      '<li>Você já sente a diferença nos <b>primeiros 3 dias</b>.</li>' +
      '<li>Em 15 dias, com dedicação, você conserta a base, na ordem certa e sem pular etapa.</li>' +
      '<li><b>Grupo exclusivo</b> de alunos de apoio.</li>' +
      '<li><b>Contato direto</b> com a Cathy.</li>' +
      '<li>E tem mais: aulas curtas de 10 minutos, 6 meses de acesso e garantia de 7 dias.</li></ul></div>' +
      '<a class="btn xl" id="pac-cta" href="' + PAC_URL + '" target="_blank" rel="noopener">Quero conhecer o Método PAC</a>';

    function fig(src, alt, cap) { return src ? '<figure><img src="' + src + '" alt="' + alt + '" loading="lazy"><figcaption>' + cap + '</figcaption></figure>' : ""; }
    var fotos = (PHOTO_PLATAFORMA || PHOTO_COMUNIDADE || PHOTO_AULA) ? '<div class="fotos">' + fig(PHOTO_PLATAFORMA, "Trecho da primeira aula do PAC", "Um trecho da 1ª aula do PAC") + fig(PHOTO_COMUNIDADE, "Questão desafio na comunidade PAC", "A comunidade PAC: uma questão desafio por dia") + fig(PHOTO_AULA, "Cathy dando palestra para alunos", "Palestra no Bernoulli, 2025") + '</div>' : "";
    var msg = "Fiz o Raio X do Método PAC: acertei " + score + " de 10 em " + fmtTime(state.tEnd - state.t0) + ". " +
      (missed.length ? "Travei em: " + missed.join(", ") + "." : "Acertei tudo!") + " Meu momento: " + prof.label.toLowerCase() + ".";
    h += '<div class="cta"><h3>Não deixe sua matemática para depois</h3><p>A nova turma do Método PAC abre em 16/11. Quem está na comunidade fica sabendo primeiro e participa das lives de revisão de base na semana de 10/11.</p><p>Como você imagina fechar esses buracos antes da sua prova? Se quiser pensar nisso comigo, me chama no WhatsApp.</p>' +
      fotos +
      '<div class="share" id="msg">' + msg + '</div>' +
      '<div class="row"><a class="btn" href="' + waLink(msg) + '" target="_blank" rel="noopener">Tirar minhas dúvidas no zap</a>' +
      '<a class="btn ghost" href="' + COMMUNITY_URL + '" target="_blank" rel="noopener">' + COMMUNITY_LABEL + '</a>' +
      '<button class="btn ghost" id="copy" type="button">Copiar meu resultado</button>' +
      '<button class="btn ghost" id="again" type="button">Refazer o teste</button></div><p class="fine" id="copied" role="status"></p></div></div></div></section>';
    return h;
  }

  function waLink(msg) {
    if (/wa\.me/.test(WHATSAPP_URL)) return WHATSAPP_URL + (WHATSAPP_URL.indexOf("?") < 0 ? "?" : "&") + "text=" + encodeURIComponent(msg);
    return WHATSAPP_URL;
  }

  function stepper() {
    if (state.view === "hero") return "";
    var cur = state.view === "profile" ? 0 : state.view === "quiz" ? 1 : 2;
    var names = ["Descobrir", "Investigar", "Resolver"];
    var h = '<ol class="stepper" aria-label="Etapas do Raio X">';
    names.forEach(function (n, i) {
      var cls = i < cur ? "done" : i === cur ? "now" : "todo";
      h += '<li class="' + cls + '"' + (i === cur ? ' aria-current="step"' : '') + '><span class="c">' + (i < cur ? "✓" : (i + 1)) + '</span><span>' + n + '</span></li>';
    });
    return h + '</ol>';
  }

  function render() {
    app.innerHTML = stepper() + (state.view === "hero" ? heroView() : state.view === "profile" ? profileView() : state.view === "quiz" ? quizView() : state.view === "gate" ? gateView() : resultView());
    bind();
  }

  var clockTimer = null;
  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) { clearInterval(clockTimer); clockTimer = null; return; }
    var s = Math.round((Date.now() - state.t0) / 1000);
    el.textContent = Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
  }

  function bind() {
    var rv = document.getElementById("reveal");
    if (rv) rv.addEventListener("click", function () {
      var box = document.getElementById("compare"); box.hidden = false; rv.hidden = true; rv.setAttribute("aria-expanded", "true");
      trackEvent("abriu_o_que_fazer_agora");
      try { box.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
    });
    var pc = document.getElementById("pac-cta");
    if (pc) pc.addEventListener("click", function () { trackEvent("clicou_conhecer_pac"); });

    var go = document.getElementById("go");
    if (go) go.addEventListener("click", function () { setView("profile"); });

    var pf = document.getElementById("pf");
    if (pf) {
      pf.addEventListener("change", function (e) { if (e.target.name === "profile") { state.profile = e.target.value; document.getElementById("start").disabled = false; } });
      pf.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!state.profile) return;
        state.idx = 0; state.picked = []; state.order = QUESTIONS.map(function (q) { return shuffle([0, 1, 2, 3]); });
        state.t0 = Date.now();
        setView("quiz");
      });
    }

    var qf = document.getElementById("qf");
    if (qf) {
      tickClock();
      if (!clockTimer) clockTimer = setInterval(tickClock, 1000);
      qf.addEventListener("change", function (e) { if (e.target.name === "opt") { state.picked[state.idx] = +e.target.value; document.getElementById("next").disabled = false; } });
      qf.addEventListener("submit", function (e) {
        e.preventDefault();
        if (state.picked[state.idx] == null) return;
        if (state.idx < QUESTIONS.length - 1) { state.idx++; setView("quiz"); }
        else { state.tEnd = Date.now(); setView("gate"); }
      });
    }

    var gf = document.getElementById("gf");
    if (gf) {
      gf.addEventListener("submit", function (e) {
        e.preventDefault();
        var n = document.getElementById("g-name").value.trim(), z = document.getElementById("g-zap").value.trim(), m = document.getElementById("g-mail").value.trim(), ok = document.getElementById("g-ok").checked, err = document.getElementById("g-err");
        var digits = z.replace(/\D/g, "");
        if (!n) { err.textContent = "Diga seu nome."; return; }
        if (digits.length < 10 || digits.length > 13) { err.textContent = "Confira o WhatsApp com DDD."; return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) { err.textContent = "Confira o e-mail."; return; }
        if (!ok) { err.textContent = "Marque o aceite para ver o resultado."; return; }
        state.lead = { name: n, zap: z, mail: m };
        sendLead();
        setView("result");
      });
    }

    ["pf", "qf", "gf"].forEach(function (id) {
      var f = document.getElementById(id);
      if (!f) return;
      var fire = function () { f.dispatchEvent(new Event("submit", { cancelable: true })); };
      var b = f.querySelector(".row .btn");
      if (b) b.addEventListener("click", fire);
      f.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); fire(); } });
    });

    var copy = document.getElementById("copy");
    if (copy) {
      copy.addEventListener("click", function () {
        var box = document.getElementById("msg"), note = document.getElementById("copied");
        function fallback() {
          try { var r = document.createRange(); r.selectNodeContents(box); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
          note.textContent = "Selecionei o texto acima. Copie e cole na comunidade.";
        }
        try {
          navigator.clipboard.writeText(box.textContent).then(function () { note.textContent = "Resultado copiado. Cole na comunidade."; }, fallback);
        } catch (e) { fallback(); }
      });
    }
    var again = document.getElementById("again");
    if (again) again.addEventListener("click", function () { state.picked = []; state.idx = 0; setView("profile"); });
  }

  render();
})();
</script>

</body></html>
